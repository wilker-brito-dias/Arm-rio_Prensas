<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Material</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1 style="margin-bottom: 5px;">➕ Novo Material</h1>
            <div id="nome-operador" style="color: var(--success); font-size: 14px; font-weight: bold; letter-spacing: 1px;">
                👤 User: Carregando...
            </div>
        </div>
    </header>

    <div class="container">
        <div class="cyber-form">
            <h2 style="color: var(--accent); margin-bottom: 20px; text-align: center;">DADOS DO SISTEMA</h2>
            
            <label style="font-size: 12px; color: var(--text-muted);">Código Numérico:</label>
            <input type="text" id="novo-cod" class="input-tech" placeholder="Ex: 50082805">
            
            <label style="font-size: 12px; color: var(--text-muted);">Descrição do Componente:</label>
            <input type="text" id="novo-desc" class="input-tech" placeholder="Ex: Luminária 10W">
            
            <label style="font-size: 12px; color: var(--text-muted);">Quantidade Inicial:</label>
            <input type="number" id="novo-qtd" class="input-tech" value="0" min="0">
            
            <label style="font-size: 12px; color: var(--accent);">Anexar Foto (Opcional):</label>
            <input type="file" id="novo-foto" class="input-tech" accept="image/*">
            
            <button class="cyber-btn" onclick="cadastrarItem()">Sincronizar Banco</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="itens.html"><span class="nav-icon">📦</span>Estoque</a>
        <a href="inserir.html" class="ativo"><span class="nav-icon">➕</span>Adicionar</a>
        <a href="historico.html"><span class="nav-icon">📜</span>Histórico</a>
        <a href="#" onclick="travarArmario()"><span class="nav-icon">🔒</span>Travar</a>
    </nav>

    <script src="config.js"></script>
    <script>
        // VERIFICA LOGIN AUTOMÁTICO
        const operadorLogado = sessionStorage.getItem('operadorLogado');
        if (!operadorLogado) {
            alert('🔒 O Armário está trancado! Faça login primeiro.');
            window.location.href = 'index.html';
        } else {
            document.getElementById('nome-operador').innerText = `👤 User: ${operadorLogado}`;
        }

        function travarArmario() {
            sessionStorage.removeItem('operadorLogado');
            window.location.href = 'index.html';
        }

        async function cadastrarItem() {
            // Não pede mais senha. Liberação direta pela sessão.
            const cod = document.getElementById('novo-cod').value.trim();
            const desc = document.getElementById('novo-desc').value.trim();
            const qtd = document.getElementById('novo-qtd').value;
            const fotoFile = document.getElementById('novo-foto').files[0];

            if(!cod || !desc) return alert("Código e Descrição são obrigatórios!");

            let fotoUrl = null;
            document.querySelector('.cyber-btn').innerText = "Sincronizando...";

            if (fotoFile) {
                const ext = fotoFile.name.split('.').pop();
                const nomeArquivo = `${cod}-${Date.now()}.${ext}`;
                const { error: errUpload } = await cliente.storage.from('imagens').upload(nomeArquivo, fotoFile);
                if (errUpload) {
                    alert("Erro na imagem: " + errUpload.message);
                    document.querySelector('.cyber-btn').innerText = "Sincronizar Banco";
                    return;
                }
                const { data } = cliente.storage.from('imagens').getPublicUrl(nomeArquivo);
                fotoUrl = data.publicUrl;
            }

            // Grava o item no banco
            const { error } = await cliente.from('itens').insert([{ 
                codigo: cod, descricao: desc, quantidade_atual: parseInt(qtd), imagem_url: fotoUrl 
            }]);

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                // Se a quantidade inicial for maior que zero, já registra no histórico quem colocou
                if(parseInt(qtd) > 0) {
                    await cliente.from('movimentacoes').insert([{ 
                        codigo_item: cod, 
                        tipo_movimentacao: 'ENTRADA', 
                        quantidade: parseInt(qtd), 
                        observacao: operadorLogado + ' (Cadastro de Novo Item)'
                    }]);
                }
                alert("Material cadastrado com sucesso!");
                window.location.href = 'itens.html'; 
            }
            document.querySelector('.cyber-btn').innerText = "Sincronizar Banco";
        }
    </script>
</body>
</html>
