<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <h1 style="margin-bottom: 5px;">📜 Histórico</h1>
            <div id="nome-operador" style="color: var(--success); font-size: 14px; font-weight: bold; letter-spacing: 1px;">
                👤 User: Carregando...
            </div>
        </div>
    </header>

    <div class="container">
        <div id="timeline" class="timeline">
            <p style="text-align: center; color: var(--accent);">Buscando registros...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="itens.html"><span class="nav-icon">📦</span>Estoque</a>
        <a href="inserir.html"><span class="nav-icon">➕</span>Adicionar</a>
        <a href="historico.html" class="ativo"><span class="nav-icon">📜</span>Histórico</a>
        <a href="#" onclick="travarArmario()"><span class="nav-icon">🔒</span>Travar</a>
    </nav>

    <script src="config.js"></script>
    <script>
        // VERIFICA LOGIN AUTOMÁTICO
        const operadorLogado = sessionStorage.getItem('operadorLogado');
        if (!operadorLogado) {
            alert('🔒 O Armário está trancado! Faça login primeiro.');
            window.location.href = 'index.html';
        } else {
            document.getElementById('nome-operador').innerText = `👤 User: ${operadorLogado}`;
        }

        function travarArmario() {
            sessionStorage.removeItem('operadorLogado');
            window.location.href = 'index.html';
        }

        async function carregarHistorico() {
            const { data, error } = await cliente.from('movimentacoes')
                .select('*, itens(descricao)')
                .order('data_hora', { ascending: false })
                .limit(50);
                
            const container = document.getElementById('timeline');
            if (error) return container.innerHTML = 'Erro: ' + error.message;

            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhum histórico registrado.</p>';
                return;
            }

            data.forEach(mov => {
                const dataFormatada = new Date(mov.data_hora).toLocaleString('pt-BR');
                const classe = mov.tipo_movimentacao === 'SAIDA' ? 'saida' : 'entrada';
                const icone = mov.tipo_movimentacao === 'SAIDA' ? '🔴 RETIRADA' : '🟢 ENTRADA';
                
                const nomeItem = mov.itens ? mov.itens.descricao : 'Item Excluído do Sistema';
                
                container.innerHTML += `
                    <div class="tl-item ${classe}">
                        <div class="tl-data">${dataFormatada} - Responsável: <b style="color: white;">${mov.observacao}</b></div>
                        <div class="tl-acao">${icone}</div>
                        <div style="font-size: 13px; color: var(--text-light);">
                            Peça: <b style="color: var(--accent);">${nomeItem}</b> (Cód: ${mov.codigo_item})<br>
                            Quantidade Modificada: <b>${mov.quantidade}</b>
                        </div>
                    </div>
                `;
            });
        }
        carregarHistorico();
    </script>
</body>
</html>
