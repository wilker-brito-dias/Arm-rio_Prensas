<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Armário das Prensas</title>
    <style>
        body { 
            margin: 0; background-color: #0f172a; height: 100vh; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            font-family: sans-serif; padding: 20px; box-sizing: border-box; text-align: center;
        }
        
        /* Título com Neon Branco Sutil */
        h1 { 
            color: #ffffff; text-transform: uppercase; letter-spacing: 2px; 
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4); 
            margin-bottom: 25px; font-size: clamp(22px, 6vw, 36px); 
        }
        
        /* Link da imagem com animação */
        .armario-link { display: block; margin-bottom: 25px; transition: transform 0.3s ease; }
        .armario-link:hover { transform: scale(1.03); }
        
        /* Ajuste para a nova foto vertical */
        img { 
            width: 100%; 
            max-width: 320px; 
            max-height: 55vh; /* Evita que a foto corte a tela em celulares pequenos */
            object-fit: contain;
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); 
            border: 2px solid #334155; 
        }
        
        .btn-entrar { 
            background: #ffffff; color: #0f172a; padding: 15px 40px; text-decoration: none; 
            font-weight: bold; border-radius: 8px; text-transform: uppercase; font-size: 16px; 
            transition: 0.3s; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); 
        }
        .btn-entrar:hover { background: #e2e8f0; box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); }

        /* Ajustes finos para celulares pequenos */
        @media (max-width: 400px) { 
            h1 { margin-bottom: 15px; } 
            img { max-width: 250px; } 
            .armario-link { margin-bottom: 15px; } 
        }
    </style>
</head>
<body>
    <h1>Estoque Armário das Prensas</h1>
    
    <!-- Imagem clicável puxando a sua foto local -->
    <a href="itens.html" class="armario-link">
        <img src="Armario_foto.png" alt="Armário">
    </a>
    
    <a href="itens.html" class="btn-entrar">🔓 Verificar itens do Armário</a>
</body>
</html>
