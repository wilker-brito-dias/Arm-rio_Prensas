<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Armário das Prensas</title>
    <style>
        body { margin: 0; background-color: #0f172a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; box-sizing: border-box; text-align: center; }
        h1 { color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4); margin-bottom: 25px; font-size: clamp(22px, 6vw, 36px); }
        .armario-link { display: block; margin-bottom: 25px; transition: transform 0.3s ease; cursor: pointer; }
        .armario-link:hover { transform: scale(1.03); }
        img { width: 100%; max-width: 320px; max-height: 55vh; object-fit: contain; border-radius: 12px; box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); border: 2px solid #334155; }
        .btn-entrar { background: #ffffff; color: #0f172a; padding: 15px 40px; text-decoration: none; font-weight: bold; border-radius: 8px; text-transform: uppercase; font-size: 16px; transition: 0.3s; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); border: none; cursor: pointer; }
        .btn-entrar:hover { background: #e2e8f0; box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); }

        /* Estilos do Modal de Login */
        .modal-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-box { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 320px; border: 1px solid #38bdf8; text-align: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .input-login { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(0,0,0,0.5); border: 1px solid #475569; border-radius: 6px; color: white; outline: none; box-sizing: border-box; font-size: 16px; }
        .input-login:focus { border-color: #38bdf8; }
        .btn-acao { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <h1>Estoque Armário das Prensas</h1>
    
    <!-- Imagem e botão agora abrem o Login em vez de ir direto pra página -->
    <a onclick="abrirLogin()" class="armario-link">
        <img src="Armario_foto.png" alt="Armário">
    </a>
    <button onclick="abrirLogin()" class="btn-entrar">🔓 Abrir Armário</button>

    <!-- Modal de Login -->
    <div id="telaLogin" class="modal-login">
        <div class="modal-box">
            <h2 style="color: #38bdf8; margin-top: 0; margin-bottom: 20px;">🔒 Acesso Restrito</h2>
            <input type="text" id="user" class="input-login" placeholder="Usuário (Digite seu nome)">
            <input type="password" id="pass" class="input-login" placeholder="Senha">
            <div style="display: flex; gap: 10px;">
                <button class="btn-acao" style="background: #64748b; color: white;" onclick="fecharLogin()">Cancelar</button>
                <button class="btn-acao" style="background: #38bdf8; color: #000;" onclick="fazerLogin()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // SEUS DOIS USUÁRIOS PERMITIDOS
        const usuariosPermitidos = [
            { nome: 'Hiccaro', senha: 'hicaro' },
            { nome: 'Eduardo', senha: 'pinto' },
            { nome: 'Cleverson', senha: '123321' },
            { nome: 'Hiccaro', senha: '123' },
            { nome: 'Wilker', senha: '7162' }
        ];

        function abrirLogin() {
            document.getElementById('telaLogin').style.display = 'flex';
        }

        function fecharLogin() {
            document.getElementById('telaLogin').style.display = 'none';
        }

        function fazerLogin() {
            const userDigitado = document.getElementById('user').value.trim();
            const passDigitada = document.getElementById('pass').value.trim();

            // Procura na lista se existe alguém com esse nome e senha exatos
            const usuarioValido = usuariosPermitidos.find(
                u => u.nome.toLowerCase() === userDigitado.toLowerCase() && u.senha === passDigitada
            );

            if (usuarioValido) {
                // Login aprovado: Salva o nome na sessão e libera a entrada
                sessionStorage.setItem('operadorLogado', usuarioValido.nome);
                window.location.href = 'itens.html';
            } else {
                alert('❌ Usuário ou senha incorretos! Acesso Negado.');
            }
        }
    </script>
</body>
</html>
